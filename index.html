  <style>:root {

}

}

.evidence-chart { width: 100%; }

svg .axis, svg .baseline { stroke: var(--ink); stroke-width: 2; fill: none; vector-effect: non-scaling-stroke; }
svg .gridline { stroke: #a9b7ab; stroke-width: 1; vector-effect: non-scaling-stroke; }

.control { fill: #778981; }
.timeline svg { width: 100%; max-height: 11cqw; display: block; }
.timeline svg text { fill: var(--ink); font: bold 24px system-ui,sans-serif; }

.timeline-options { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: .45em; }
.timeline-options button { min-width: 0; }
.timeline-options span { display: block; font-size: .8em; }
.timeline figcaption { border-left: 4px solid var(--accent); padding: .5em .65em; margin-top: .65em; background: var(--white); min-height: 3.25em; }
table { border-collapse: collapse; text-align: left; width: 100%; background: var(--white); }

.graph { display: grid; grid-template-columns: minmax(0,1.85fr) minmax(0,1fr); column-gap: .8em; align-items: center; }

.graph-caption { grid-column: 1 / -1; color: var(--muted); margin: .15em 0; }

meter { width: min(10em,50%); margin-left: .5em; }
dialog {
  color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
  padding: 1.25rem; width: min(56rem,calc(100vw - 1.5rem)); max-height: 86dvh;

.demo-notes dt { font-weight: 750; color: var(--green); }
.demo-notes dd { margin: 0 0 .8rem; }

/* V6.1 — diagramas docentes reutilizables, con texto mínimo por pantalla */
.storyboard { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap: .85em; align-items:stretch; }

.review-count { display: flex; align-items: baseline; gap: .6em; margin: .5em 0; }
.score { color: var(--accent); margin: .25em 0 0; }

.field-list { margin: .5em 0 0; padding: 0; list-style: none; }
.field-list li, .product-list li { border-bottom: 1px solid var(--rule); padding: .3em 0; }
.product-list { padding: .4em .8em; margin: 0; list-style: none; background: var(--white); }
.product-list li { display: grid; grid-template-columns: 1.6em 1fr 1.4fr; align-items: center; gap: .45em; }

.product-list .case-source { font-size: 1em; }
.product-list li:last-child { border-bottom: 0; }
.teaching-plot { display: block; width: 100%; height: auto; margin-top: .55em; }
.acta summary { display: inline-flex; align-items: center; min-height: 44px; cursor: pointer; text-decoration: underline; font-weight: 650; }
.acta summary::before { content: '▸'; margin-right: .35em; }
.acta[open] summary::before { content: '▾'; }
.mini-slide h3 { max-width: 21ch; }
.work-modes, .learning-trace, .agent-trace { margin: 0; padding: 0; list-style: none; }
.work-modes li {
  display: grid; grid-template-columns: .75fr 1.4fr 1.15fr; align-items: baseline; gap: .6em;
  padding: .6em 0; border-bottom: 1px solid var(--rule);
}
.work-modes strong { color: var(--accent); font: 600 1.75em Georgia,serif; }
.work-modes q { font-weight: 650; }
.work-modes span { color: var(--muted); }

.learning-trace li { position: relative; border-top: 3px solid var(--accent); padding: 1.1em 1.25em 0 0; }
.learning-trace li::before {
  content: ''; position: absolute; top: -.35em; left: 0; width: .58em; height: .58em;
  background: var(--accent); border-radius: 50%;
}
.learning-trace li span { font-size: .86em; font-weight: 700; color: var(--accent); }
.learning-trace h2 { font: 500 1.9em Georgia,serif; margin: .32em 0; }
.learning-trace p { margin: 0; max-width: 23ch; }
.agent-trace > div, .agenda-lines > div {
  display: grid; grid-template-columns: 1fr 1.6fr; gap: 1em; align-items: baseline;
  padding: .5em 0; border-bottom: 1px solid var(--rule);
}
.agent-trace dt { font: 500 1.45em Georgia,serif; color: var(--accent); }
.agent-trace dd, .agenda-lines dd { margin: 0; }
.visual-prices { align-content: center; }
.return-route { min-height: 44px; display: grid; align-items: center; text-align: center; color: var(--accent); font-weight: 650; }
.england-flag { width: 1.14em; height: .7em; vertical-align: .01em; outline: 1px solid var(--rule); }
.evidence-overview { grid-column: 1/-1; }
.evidence-overview .sample-sheet { font-size: 1em; }
.evidence-overview th:first-child { width: 37%; }
.evidence-overview .case-source { font-size: 1em; }
.price-example { max-width: 46em; }
.price-example h2 { margin: 0; font: 500 1.6em Georgia,serif; }
.price-example p { margin: .35em 0 .6em; }
.price-example dl { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); margin: .75em 0; gap: .7em; }
.price-example dl div { padding: .42em 0; border-block: 1px solid var(--rule); }
.price-example dt { color: var(--muted); }
.price-example dd { margin: 0; font: 600 1.8em Georgia,serif; color: var(--accent); }
.pricing-links { display: flex; flex-wrap: wrap; gap: .3em 1em; margin-top: .55em; }
.agenda-lines { margin: .4em 0 0; }

.record-pair section p { font: 500 1.55em Georgia,serif; }
.count-row { display: grid; grid-template-columns: 13em 1fr; align-items: center; gap: .7em; padding: .6em 0; border-bottom: 1px solid var(--rule); }
.count-row b, .count-row span { display: block; }
.count-row span { color: var(--muted); font-size: .86em; }
.unit-strip { display: grid; grid-template-columns: repeat(14,minmax(0,1fr)); gap: .16em; max-width: 24em; }
.unit-strip i { display: block; aspect-ratio: 1; border: 2px solid var(--accent); border-radius: 50%; }
.unit-strip .counted { background: var(--accent); }
.transfer-ticket { padding: .6em 1.1em; border-left: .2em solid var(--accent); background: var(--white); }
.transfer-ticket p { margin: .55em 0; font: 500 1.3em Georgia,serif; }
.transfer-ticket span { color: var(--accent); }
.output-comparison { margin-top: .45em; }
.output-comparison th, .output-comparison td { padding: .28em .37em; }
@media (max-width: 800px), ((max-height: 465px) and (max-width: 1200px)) {
  .practice-table th, .practice-table td { padding: .48em .22em; }
  .practice-table thead th { font-size: .94em; }

  .time-gain { flex-wrap: wrap; gap: .2em .5em; }
  .scale text { font-size: 23px; }
}
