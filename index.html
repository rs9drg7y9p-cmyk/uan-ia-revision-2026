  <style>:root {

}

}

.evidence-chart { width: 100%; }

.evidence-chart figcaption { border-left: 4px solid var(--accent); padding: .3em .65em; background: var(--white); }
svg .axis, svg .baseline { stroke: var(--ink); stroke-width: 2; fill: none; vector-effect: non-scaling-stroke; }
svg .gridline { stroke: #a9b7ab; stroke-width: 1; vector-effect: non-scaling-stroke; }

.control { fill: #778981; }
.timeline svg { width: 100%; max-height: 11cqw; display: block; }
.timeline svg text { fill: var(--ink); font: bold 24px system-ui,sans-serif; }

.timeline-options { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: .45em; }
.timeline-options button { min-width: 0; }
.timeline-options span { display: block; font-size: .8em; }
.timeline figcaption { border-left: 4px solid var(--accent); padding: .5em .65em; margin-top: .65em; background: var(--white); min-height: 3.25em; }
table { border-collapse: collapse; text-align: left; width: 100%; background: var(--white); }
th,td { border-bottom: 1px solid var(--rule); padding: .37em .67em; }

.graph { display: grid; grid-template-columns: minmax(0,1.85fr) minmax(0,1fr); column-gap: .8em; align-items: center; }

.graph-caption { grid-column: 1 / -1; color: var(--muted); margin: .15em 0; }

.dossier img { display: block; width: 100%; max-height: 21cqw; object-fit: contain; background: #e6e5d9; border-radius: 6px; }

meter { width: min(10em,50%); margin-left: .5em; }
dialog {
  color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
  padding: 1.25rem; width: min(56rem,calc(100vw - 1.5rem)); max-height: 86dvh;

.demo-notes dt { font-weight: 750; color: var(--green); }
.demo-notes dd { margin: 0 0 .8rem; }
.example-label { color: var(--muted); }

/* V6.1 — diagramas docentes reutilizables, con texto mínimo por pantalla */
.storyboard { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap: .85em; align-items:stretch; }
